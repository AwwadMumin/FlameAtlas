/* V3 visual-only enhancements: preserve the existing research UI and API behavior. */
:root{--flame-orange:#d65a31}
.shell{isolation:isolate;position:relative;background:transparent}
.shell>.topbar,.shell>.workspace,.shell>.footer{position:relative;z-index:1}
.topbar,.footer{background:rgba(38,42,48,.92);backdrop-filter:blur(18px)}
.panel,.metrics>div{background:rgba(42,45,51,.89);backdrop-filter:blur(7px)}
.atmosphere{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0;background:radial-gradient(ellipse at 75% 90%,#342c2b 0%,transparent 52%),linear-gradient(125deg,#202329 0%,#1a1e25 60%,#242329 100%)}
.atmosphere-canvas{position:absolute;inset:0;width:100%;height:100%;opacity:.86}
.cursor-ember-glow{position:fixed;top:0;left:0;width:360px;height:360px;border-radius:50%;opacity:0;will-change:transform;transition:opacity .35s ease;background:radial-gradient(circle,rgba(214,90,49,.14) 0%,rgba(214,90,49,.07) 28%,rgba(214,90,49,.02) 52%,transparent 72%);mix-blend-mode:screen}
.fire-plume{position:absolute;bottom:-150px;width:380px;height:560px;filter:blur(52px);transform-origin:50% 100%;border-radius:50% 50% 38% 44%;opacity:.3;background:radial-gradient(ellipse at 50% 80%,rgba(255,128,52,.35) 0%,rgba(214,90,49,.22) 27%,rgba(124,51,37,.1) 48%,transparent 73%);animation:fire-breathe 7s ease-in-out infinite alternate}
.fire-plume-one{right:6%}.fire-plume-two{right:26%;width:240px;height:400px;animation-delay:-3s;opacity:.2}
.smoke-plume{position:absolute;bottom:-130px;width:340px;height:600px;border-radius:45%;background:radial-gradient(ellipse at 50% 55%,rgba(113,110,112,.11),rgba(93,86,89,.045) 42%,transparent 70%);filter:blur(38px);opacity:.65;animation:smoke-drift 12s ease-in-out infinite alternate}
.smoke-plume-one{right:12%}.smoke-plume-two{right:37%;animation-delay:-5s;opacity:.35}
@keyframes fire-breathe{0%{transform:translateY(35px) rotate(-7deg) scale(.88,1);opacity:.2}55%{transform:translateY(-22px) rotate(5deg) scale(1.12,1.22);opacity:.37}100%{transform:translateY(-48px) rotate(-4deg) scale(.98,1.35);opacity:.25}}
@keyframes smoke-drift{from{transform:translate(10px,40px) rotate(-10deg) scale(.95);opacity:.32}to{transform:translate(-75px,-120px) rotate(14deg) scale(1.25);opacity:.7}}
/* The logo's charcoal shapes need a light backing to remain legible on the dark header. */
.brand{gap:15px}
.brand-mark{display:grid;place-items:center;width:66px;height:66px;flex:none;background:#f1f0ec;border:1px solid rgba(255,255,255,.35);border-radius:17px;box-shadow:0 0 0 1px rgba(214,90,49,.18),0 5px 24px rgba(214,90,49,.15)}
.brand-mark img{width:58px;height:55px;object-fit:contain;filter:none}
.brand:hover .brand-mark{box-shadow:0 0 0 1px rgba(214,90,49,.45),0 0 26px rgba(214,90,49,.22)}
/* Active navigation is indicated by a precise orange underline, not a filled rectangle. */
.topbar nav button{position:relative;border-radius:0;background:transparent!important;box-shadow:none!important;transition:color .2s ease}
.topbar nav button::after{content:"";position:absolute;bottom:2px;left:18px;right:18px;height:2px;border-radius:3px;background:var(--flame-orange);transform:scaleX(0);transform-origin:center;transition:transform .23s ease}
.topbar nav button.active{color:#fff}
.topbar nav button.active::after,.topbar nav button:hover::after,.topbar nav button:focus-visible::after{transform:scaleX(1)}
.topbar nav button:hover{color:#fff}
@media(max-width:850px){.topbar nav button::after{left:9px;right:9px}}
@media(max-width:520px){.brand-mark{width:53px;height:53px;border-radius:13px}.brand-mark img{width:46px;height:45px}.cursor-ember-glow{display:none}.fire-plume{filter:blur(64px);opacity:.16}}
@media(prefers-reduced-motion:reduce){.fire-plume,.smoke-plume{animation:none!important}.cursor-ember-glow{display:none!important}.topbar nav button::after{transition:none}}

/* V4 visual refinement — brand, starfield, smoke and fire only. */
.brand-mark{background:rgba(241,240,236,.50);border-color:rgba(255,255,255,.17);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 0 0 1px rgba(214,90,49,.25),0 5px 28px rgba(214,90,49,.16),inset 0 1px rgba(255,255,255,.13)}
.brand:hover .brand-mark{background:rgba(241,240,236,.59);box-shadow:0 0 0 1px rgba(214,90,49,.50),0 0 30px rgba(214,90,49,.25)}
.brand strong{color:#e77a51;text-shadow:0 0 21px rgba(214,90,49,.17);letter-spacing:.14em}
.atmosphere-canvas{opacity:1}
.atmosphere{background:radial-gradient(ellipse at 78% 95%,rgba(101,48,34,.38),transparent 54%),radial-gradient(ellipse at 12% 8%,rgba(52,57,78,.22),transparent 55%),linear-gradient(125deg,#202329 0%,#1a1e25 60%,#242329 100%)}
.smoke-plume{background:radial-gradient(ellipse at 50% 54%,rgba(165,148,144,.20),rgba(116,112,119,.095) 43%,transparent 73%);opacity:.82;filter:blur(31px)}
.smoke-plume-two{opacity:.58}
.fire-plume{opacity:.43;filter:blur(38px);background:radial-gradient(ellipse at 50% 80%,rgba(255,145,66,.42) 0%,rgba(214,90,49,.30) 29%,rgba(124,51,37,.12) 54%,transparent 75%)}
.fire-plume-two{opacity:.32}
@media(max-width:520px){.smoke-plume{opacity:.45}.fire-plume{opacity:.24}.brand strong{font-size:15px}}
@media(prefers-reduced-motion:reduce){.fire-plume,.smoke-plume{animation:none!important}}

/* V5: translucency and a photographic-style, procedural combustion atmosphere. */
.brand-mark{background:rgba(241,240,236,.50)!important;border-color:rgba(255,255,255,.19);backdrop-filter:blur(14px) saturate(1.08)}
.brand:hover .brand-mark{background:rgba(241,240,236,.55)!important}
.atmosphere-canvas{opacity:1}
/* Avoid large pill-shaped CSS flames and circular smoke blobs: canvas provides detailed filaments. */
.fire-plume{opacity:.17!important;filter:blur(75px)!important;animation-duration:9s}
.fire-plume-two{opacity:.11!important}
.smoke-plume{opacity:.30!important;filter:blur(75px)!important;animation-duration:16s}
.smoke-plume-two{opacity:.19!important}
@media(prefers-reduced-motion:reduce){.fire-plume,.smoke-plume{animation:none!important}}

/* V6: genuinely transparent logo plate — not a half-opaque white square. */
.brand-mark,.brand:hover .brand-mark{
  background:rgba(235,239,243,.035)!important;
  border:1px solid rgba(235,239,243,.10)!important;
  backdrop-filter:blur(7px)!important;
  -webkit-backdrop-filter:blur(7px)!important;
  box-shadow:0 0 0 1px rgba(214,90,49,.12),0 0 18px rgba(214,90,49,.10)!important;
}
.brand:hover .brand-mark{background:rgba(235,239,243,.065)!important;border-color:rgba(214,90,49,.28)!important}
.brand-mark img{filter:drop-shadow(0 0 5px rgba(255,144,82,.38))!important}
/* Let the cinematic flame read through the layout without sacrificing scientific text contrast. */
.atmosphere-canvas{opacity:1!important}
.fire-plume,.smoke-plume{display:none!important}

/* V7: remove the logo tile entirely; retain only a soft orange halo. */
.brand-mark,.brand:hover .brand-mark{
  position:relative;isolation:isolate;overflow:visible;
  background:transparent!important;border:0!important;border-radius:0!important;
  backdrop-filter:none!important;-webkit-backdrop-filter:none!important;
  box-shadow:none!important;
}
.brand-mark::before{
  content:"";position:absolute;z-index:-1;pointer-events:none;
  width:104px;height:104px;left:50%;top:50%;transform:translate(-50%,-50%);
  background:radial-gradient(circle,rgba(214,90,49,.22) 0%,rgba(214,90,49,.11) 30%,rgba(214,90,49,.035) 57%,transparent 73%);
  border-radius:50%;filter:blur(9px);
}
.brand-mark img{position:relative;z-index:1;filter:brightness(1.12) drop-shadow(0 0 5px rgba(255,147,86,.65)) drop-shadow(0 0 12px rgba(214,90,49,.24))!important}
.brand:hover .brand-mark::before{background:radial-gradient(circle,rgba(214,90,49,.29),rgba(214,90,49,.10) 44%,transparent 74%)}
/* No CSS flame or smoke layers remain. */
.fire-plume,.smoke-plume{display:none!important}

.verified-pill:hover{border-color:#d65a31;color:#fff}
.preview-note.ok{border-color:#4f6b5c;background:#2c3530;color:#c7ded0}
.preview-note.ok b{color:#fff}
.outcome{font:600 11px 'IBM Plex Mono',monospace;padding:4px 8px;border-radius:4px;white-space:nowrap;display:inline-block}
.outcome.yes{background:#4a2e26;color:#ffb39a}.outcome.no{background:#283a33;color:#a9dcc0}.outcome.unk{background:#33363d;color:#aeb3bb}
.quote-block{margin:22px 0;padding:18px 18px 16px;border-left:3px solid #d65a31;background:#23272d;border-radius:0 8px 8px 0}
.quote-block .overline{display:block;margin-bottom:10px}
.quote-block q{display:block;color:#f1f1f0;font-size:14px;line-height:1.7;quotes:"\201C" "\201D"}
.quote-block small{display:block;margin-top:10px;color:#9ea5ae;font-size:11px}
.issue-list{margin:0 0 20px;padding:0;list-style:none}
.issue-list li{font-size:12px;color:#e8bdac;line-height:1.6;padding:8px 0;border-bottom:1px dashed #50555e}
.scenario-form{display:flex;flex-wrap:wrap;align-items:end;gap:12px;margin-top:16px}
.scenario-form label{color:#aeb3bb;font-size:11px;min-width:120px;flex:1}
.scenario-form input,.scenario-form select{display:block;width:100%;height:41px;margin-top:7px;padding:0 12px;background:#24272d;color:#f1f1f0;border:1px solid #51565e;border-radius:6px;font-size:13px}
.presets{display:flex;gap:8px;flex-wrap:wrap}
.presets button{border:1px solid #565b63;background:#30343b;color:#e5e6e8;border-radius:6px;padding:9px 13px;font-size:12px;font-weight:600}
.presets button.on{border-color:#d65a31;background:#41312d;color:#fff}
.gap-callout{padding:26px;border:1px solid #75513f;background:#3a302d;border-radius:10px;margin-bottom:17px}
.gap-callout h2{font-size:22px;margin:8px 0 10px}
.gap-callout p{color:#e8c8bb;font-size:13px;line-height:1.7;margin:0}
.gap-callout .big{font:600 44px 'IBM Plex Sans';color:#ff9a76;margin:6px 0}
.equation{font:500 14px 'IBM Plex Mono',monospace;color:#f1f1f0;background:#23272d;border-radius:7px;padding:12px 14px;margin:10px 0;overflow-x:auto;white-space:nowrap}
.bar-cell{display:flex;align-items:center;gap:10px;min-width:170px}
.bar-track{position:relative;flex:1;height:8px;background:#3a3e46;border-radius:4px;min-width:90px}
.bar-fill{position:absolute;left:0;top:0;height:8px;background:#d65a31;border-radius:4px}
.bar-ci{position:absolute;top:3px;height:2px;background:#f1f1f0}
.conf{font:600 11px 'IBM Plex Mono',monospace}
.conf.High{color:#a9dcc0}.conf.Medium{color:#f0c987}.conf.Low{color:#eaa18c}
.answer ul{margin:14px 0 0;padding-left:18px;color:#d8dce0;font-size:14px;line-height:1.8}
.answer .basis{margin-top:18px;font-size:12px;color:#9ea5ae}
.citation-list article q{display:block;color:#c9cdd3;font-size:12px;line-height:1.6;margin-top:8px;quotes:"\201C" "\201D"}
.ai-panel{margin:0 20px 20px;border:1px solid #565b63;border-radius:8px;padding:16px;background:#24272d}
.ai-panel .row{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-top:10px}
.ai-panel label{flex:1;min-width:160px;color:#aeb3bb;font-size:11px}
.ai-panel input{display:block;width:100%;height:38px;margin-top:6px;padding:0 10px;background:#1f2227;color:#f1f1f0;border:1px solid #51565e;border-radius:6px;font-size:12px}
.ai-panel p{color:#aeb4bc;font-size:12px;line-height:1.6;margin:6px 0 0}
.ai-out{margin-top:22px;padding-top:18px;border-top:1px solid #454951}
.ai-out ol{margin:12px 0 0;padding-left:20px;color:#d8dce0;font-size:14px;line-height:1.75}
.ai-out li{margin-bottom:10px}
.badge{display:inline-block;font:600 10px 'IBM Plex Mono',monospace;padding:3px 7px;border-radius:4px;margin-left:8px;vertical-align:middle;white-space:nowrap}
.badge.ok{background:#283a33;color:#a9dcc0}.badge.bad{background:#4a2426;color:#ffb0b0}.badge.warn{background:#463a22;color:#f0c987}
.ai-out li.flagged{color:#ffb0b0;text-decoration:underline wavy #d65a31;text-underline-offset:4px}
.ai-sum{font:600 12px 'IBM Plex Mono',monospace;color:#e8c8bb;margin-top:6px}
.ai-cites{font-size:11px;color:#9ea5ae}
.ds-toggle{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:17px}
.ds-toggle button{border:1px solid #565b63;background:#30343b;color:#e5e6e8;border-radius:7px;padding:11px 15px;font-size:12px;font-weight:600;text-align:left}
.ds-toggle button small{display:block;font-weight:400;color:#aeb3bb;margin-top:3px;font-size:11px}
.ds-toggle button.on{border-color:#d65a31;background:#41312d;color:#fff}
.tier{font:600 10px 'IBM Plex Mono',monospace;padding:3px 7px;border-radius:4px;background:#463a22;color:#f0c987;white-space:nowrap}
.cross{margin-top:16px;padding-top:16px;border-top:1px solid #75513f}
.cross p{margin:6px 0 0}
.credit{color:#9da4ac}
.credit a{color:#e58d70}
</style>
</head>

": [], "evidence": "quote_verified", "source": "NASA PSI PSI-26 raw file", "outcome_method": "crew-note rule (89.5% held-out)", "pressure_assumed": false}, {"id": "PSI-26_row7", "investigation": "BASS", "material": "SIBAL 2 cm", "material_family": "SIBAL (cotton-fiberglass fabric)", "gravity": "micro", "o2_percent": 21.9, "pressure_kpa": 98.2853, "flow_cms": 10.0, "flow_direction": null, "sustained": true, "spread_mm_s": null, "outcome_text": "~ 40 s burn, Don asked if images were too saturated, Paul said OK. Don set up 2nd still camera for additional images.", "quote": "~ 40 s burn, Don asked if images were too saturated, Paul said OK.", "source_id": "PSI-26", "issues": [], "evidence": "quote_verified", "source": "NASA PSI PSI-26 raw file", "outcome_method": "crew-note rule (89.5% held-out)", "pressure_assumed": false}, {"id": "PSI-26_row8", "investigation": "BASS", "material": "SIBAL 2 cm", "material_family": "SIBAL (cotton-fiberglass fabric)", "gravity": "micro", "o2_percent": 21.9, "pressure_kpa": 98.2853, "flow_cms": 5.0, "flow_direction": null, "sustained": true, "spread_mm_s": null, "outcome_text": "~ 60 s burn,   Don  said he like to watch solid samples burn in space and it makes him appreciate that he wouldn't want to be be there in a real fire - it wouldn't be pretty.", "quote": "~ 60 s burn, Don said he like to watch solid samples burn in space and it makes him appreciate that he", "source_id": "PSI-26", "issues": [], "evidence": "quote_verified", "source": "NASA PSI PSI-26 raw file", "outcome_method": "crew-note rule (89.5% held-out)", "pressure_assumed": false}, {"id": "PSI-26_row9", "investigation": "BASS", "material": "PMMA sphere 2 cm", "material_family": "PMMA sphere", "gravity": "micro", "o2_percent": 21.7, "pressure_kpa": 99.2985, "flow_cms": 10.0, "flow_direction": null, "sustained": true, "spread_mm_s": null, "outcome_text": "same sphere as previous.   Did not remove soot.   Don again has 2nd still camera set up.  Picked -4 ev for next test based on a quick scroll of these images.", "quote": "same sphere as previous. Did not remove soot. Don again has 2nd still camera set up. Picked -4 ev for next test", "source_id": "PSI-26", "issues": [], "evidence": "quote_verified", "source": "NASA PSI PSI-26 raw file", "outcome_method": "crew-note rule (89.5% held-out)", "pressure_assumed": false}, {"id": "PSI-26_row10", "investigation": "BASS", "material": "PMMA sphere 2 cm", "material_family": "PMMA sphere", "gravity": "micro", "o2_percent": 21.7, "pressure_kpa": 99.2985, "flow_cms": 10.0, "flow_direction": null, "sustained": true, "spread_mm_s": null, "outcome_text": "Filter on test.  Don didn't reset the camera trigger, so only got 100 frames.", "quote": "Filter on test. Don didn't reset the camera trigger, so only got 100 frames.", "source_id": "PSI-26", "issues": [], "evidence": "quote_verified", "source": "NASA PSI PSI-26 raw file", "outcome_method": "crew-note rule (89.5% held-out)", "pressure_assumed": false}, {"id": "PSI-26_row11", "investigation": "BASS", "material": "PMMA sphere 2 cm", "material_family": "PMMA sphere", "gravity": "micro", "o2_percent": 21.7, "pressure_kpa": 99.2985, "flow_cms": 10.0, "flow_direction": null, "sustained": true, "spread_mm_s": null, "outcome_text": "No filter on this test.  Don didn't reset the camera trigger, so only got 100 frames.  Very low flows possible (AIR reading 0) at FAN 42.  Apparent at end with N2 extinguishment.  Flame doesn't go out until fan goes to 38.", "quote": "Flame doesn't go out until fan goes to 38.", "source_id": "PSI-26", "issues": [], "evidence": "quote_verified", "source": "NASA PSI PSI-26 raw file", "outcome_method": "crew-note rule (89.5% held-out)", "pressure_assumed": false}, {"id": "PSI-26_row12", "investigation": "BASS", "material": "PMMA sphere 1 cm", "material_family": "PMMA sphere", "gravity": "micro", "o2_percent": 21.89, "pressure_kpa": 100.3251, "flow_cms": 6.0, "flow_direction": null, "sustained": true, "spread_mm_s": null, "outcome_tex <script>
const D = JSON.parse(document.getElementById('data').textContent);
const R = D.records;
const byId = Object.fromEntries(R.map(r => [r.id, r]));
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = (v, unit = '', d = 1) => v === null || v === undefined ? '—' : `${(+v).toFixed(d).replace(/\.0+$/, '')}${unit}`;
const pct = v => v === null || v === undefined ? '—' : `${Math.round(v * 100)}%`;
const gLabel = g => g === 'micro' ? 'Microgravity' : g === 'earth' ? 'Earth (1 g)' : g;
const outcome = r => r.sustained === true ? '<span class="outcome yes">Burned</span>' : r.sustained === false ? '<span class="outcome no">No sustained burn</span>' : '<span class="outcome unk">Not reported</span>';
const src = id => D.sources[id] || {title: id, url: null};
const families = [...new Set(R.map(r => r.material_family).filter(Boolean))].sort();
const invs = [...new Set(R.map(r => r.investigation))].sort();
const SOURCES = [...new Set(R.map(r => r.source_id))].sort();

const state = { query: '', family: 'All materials', gravity: 'All gravity', inv: 'All investigations', selected: [],
  scenario: { preset: 'moon', o2: 30, pressure: 70.3, flow: '', gravity: 'micro' }, question: '', answer: null };
try { const s = JSON.parse(sessionStorage.getItem('fa-selected') || '[]'); if (Array.isArray(s)) state.selected = s.filter(id => byId[id]); } catch (e) {}
const saveSel = () => { try { sessionStorage.setItem('fa-selected', JSON.stringify(state.selected)); } catch (e) {} };

/* ---------- the same mathematics as flame_atlas.py ---------- */
const VARS = [['o2_percent', 'o2'], ['pressure_kpa', 'pressure'], ['flow_cms', 'flow']];
function distance(run, sc) {
  if (sc.o2 !== null && run.o2_percent === null) return { d: Infinity, partial: true, terms: [] };
  let total = 0, used = 0; const terms = [];
  const wanted = VARS.filter(([, k]) => sc[k] !== null).length;
  for (const [f, k] of VARS) {
    if (sc[k] === null || run[f] === null || run[f] === undefined) continue;
    const t = (run[f] - sc[k]) / D.tol[f]; total += t * t; used++; terms.push({ f, k, run: run[f], target: sc[k], tol: D.tol[f], t });
  }
  if (!used) return { d: Infinity, partial: true, terms };
  return { d: Math.sqrt(total), partial: used < wanted, terms };
}
function wilson(k, n, z = 1.96) {
  if (!n) return null; const p = k / n, den = 1 + z * z / n, c = (p + z * z / (2 * n)) / den;
  const h = z * Math.sqrt(p * (1 - p) / n + z * z / (4 * n * n)) / den; return [Math.max(0, c - h), Math.min(1, c + h)];
}
function confidence(close) {
  const n = close.length, s = new Set(close.map(r => r.source_id)).size;
  return n >= 3 && s >= 2 ? 'High' : n >= 2 ? 'Medium' : n === 1 ? 'Low' : null;
}
function rank(sc) {
  const m = {};
  let nearest = null;
  for (const r of R) {
    if (r.gravity !== sc.gravity) continue;
    const { d, partial, terms } = distance(r, sc);
    // The nearest run must carry every variable the scenario sets (as in the engine's gap map).
    if (!partial && (!nearest || d < nearest.d)) nearest = { r, d, terms };
    if (d > 2) continue;
    const key = r.material_family || r.material; if (!key) continue;
    const e = m[key] = m[key] || { close: [], far: [], partial: false };
    (d <= 1 ? e.close : e.far).push(Object.assign({}, r, { d })); e.partial = e.partial || partial;
  }
  const rows = Object.entries(m).map(([material, e]) => {
    const known = e.close.filter(r => r.sustained !== null);
    const k = known.filter(r => r.sustained).length;
    return { material, close: e.close.length, far: e.far.length, share: known.length ? k / known.length : null,
      k, n: known.length, ci: wilson(k, known.length), conf: e.close.length ? confidence(e.close) : 'Low',
      sources: [...new Set(e.close.concat(e.far).map(r => r.source_id))].sort(), partial: e.partial, runs: e.close.concat(e.far) };
  });
  rows.sort((a, b) => (b.share ?? -1) - (a.share ?? -1) || b.close - a.close);
  return { rows, nearest };
}

const PAGES = {

};
function page() { const h = location.hash.replace('#', ''); return PAGES[h] ? h : 'explorer'; }

    </section>
    <aside class="panel citations"><div class="panel-title"><div><span class="overline">EVIDENCE CONTEXT</span><h2>Sources &amp; citations</h2></div></div>
      ${cites.length ? `<div class="citation-list">${cites.map((c, i) => `<article><span>[${i + 1}]</span><div><strong>${esc(c.title)}</strong><small>${esc(c.source)}${c.id && c.id !== c.source ? ` · ${esc(c.id)}` : ''}</small>${c.quote ? `<q>${esc(c.quote)}</q>` : ''}${c.url ? `<a href="${esc(c.url)}" target="_blank" rel="noreferrer">Open original source ↗</a>` : ''}</div></article>`).join('')}</div>`
      : `<div class="citation-empty"><strong>Evidence context</strong><p>Ask a question, or select runs in the Evidence Explorer, to see the NASA records behind the answer.</p></div>`}
    </aside></div>`;
}

/* ---------- drawer ---------- */
function openRecord(id) {
  const r = byId[id]; if (!r) return;
  const s = src(r.source_id);
  const fields = [['Investigation', r.investigation], ['Material', r.material], ['Material family', r.material_family || '—'], ['Gravity regime', gLabel(r.gravity)],
    ['Oxygen concentration', fmt(r.o2_percent, '%')], ['Pressure', fmt(r.pressure_kpa, ' kPa')], ['Airflow velocity', fmt(r.flow_cms, ' cm/s')], ['Flow direction', r.flow_direction || '—'],
    ['Outcome', r.sustained === true ? 'Burned' : r.sustained === false ? 'No sustained burn' : 'Not reported'], ['Source ID', r.source_id]];
  document.getElementById('drawerRoot').innerHTML = `<div class="modal-backdrop" id="bd"><aside class="detail-drawer" role="dialog" aria-modal="true" aria-label="Experiment details">
    <div class="drawer-top"><span class="overline">EXPERIMENT RECORD · ${esc(r.id)}</span><button aria-label="Close details" id="closeD">✕</button></div>
    <h2>${esc(r.material)}</h2><p>${esc(r.outcome_text || '')}</p>
    ${r.quote ? `<div class="quote-block"><span class="overline">NASA’S OWN WORDS</span><q>${esc(r.quote)}</q><small>Found word for word in ${esc(s.title)} (${esc(r.source_id)}).</small></div>` : `<div class="quote-block"><span class="overline">SOURCE · NASA REPORT TABLE</span><q style="quotes:none">${esc(r.source || s.title)}</q><small>Label: ${esc(r.outcome_method || '—')}.${r.pressure_assumed ? ' Pressure not reported in the source (cabin pressure assumed), so it is left empty and not used for distance.' : ''}</small></div>`}
    ${(r.issues || []).length ? `<span class="overline">NOTES ON NASA’S FILE</span><ul class="issue-list">${r.issues.map(i => `<li>${esc(i)}</li>`).join('')}</ul>` : ''}
    <div class="detail-fields">${fields.map(([k, v]) => `<div><span>${esc(k)}</span><strong>${esc(v)}</strong></div>`).join('')}</div>
    ${s.url ? `<a class="btn primary" href="${esc(s.url)}" target="_blank" rel="noreferrer">Open original source ↗</a>` : ''}
    <button class="btn outline" id="toggleD">${state.selected.includes(r.id) ? 'Remove from comparison' : 'Add to comparison'}</button></aside></div>`;
  const close = () => { document.getElementById('drawerRoot').innerHTML = ''; };
  document.getElementById('bd').addEventListener('mousedown', e => { if (e.target.id === 'bd') close(); });
  document.getElementById('closeD').onclick = close;
  document.getElementById('toggleD').onclick = () => { toggle(r.id); close(); render(); };
  document.getElementById('closeD').focus();
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') document.getElementById('drawerRoot').innerHTML = ''; });
function toggle(id) { state.selected = state.selected.includes(id) ? state.selected.filter(x => x !== id) : state.selected.concat(id); saveSel(); }

/* ---------- events ---------- */
function bind(p) {
  const v = document.getElementById('view');
  v.querySelectorAll('[data-open]').forEach(b => b.onclick = () => openRecord(b.dataset.open));
  v.querySelectorAll('[data-go]').forEach(b => b.onclick = () => go(b.dataset.go));
  v.querySelectorAll('[data-sel]').forEach(c => c.onchange = () => { toggle(c.dataset.sel); render(); });
  const $ = id => document.getElementById(id);
  v.querySelectorAll('[data-ds]').forEach(b => b.onclick = () => { state.dataset = b.dataset.ds; render(); });
  v.querySelectorAll('[data-xopen]').forEach(b => b.onclick = () => openExt(b.dataset.xopen));
  if (p === 'explorer' && state.dataset === 'extended' && X.length) {
    $('xForm').onsubmit = e => { e.preventDefault(); state.x.query = $('xq').value; render(); };
    $('xCls').onchange = e => { state.x.cls = e.target.value; render(); };
    $('xInv').onchange = e => { state.x.inv = e.target.value; render(); };
    $('xClear').onclick = () => { state.x = { query: '', cls: 'All fuel types', inv: 'All investigations' }; render(); };
    return;
  }
  if (p === 'explorer') {
    $('searchForm').onsubmit = e => { e.preventDefault(); state.query = $('q').value; render(); };
    $('q').oninput = e => { state.query = e.target.value; clearTimeout(window._qt); window._qt = setTimeout(() => { render(); const q = $('q'); q.focus(); q.setSelectionRange(q.value.length, q.value.length); }, 250); };
    $('fFam').onchange = e => { state.family = e.target.value; render(); };
    $('fGrav').onchange = e => { state.gravity = e.target.value; render(); };
    $('fInv').onchange = e => { state.inv = e.target.value; render(); };
    $('clear').onclick = () => { Object.assign(state, { query: '', family: 'All materials', gravity: 'All gravity', inv: 'All investigations' }); render(); };
    if ($('toRanker')) $('toRanker').onclick = () => go('ranker');
  }
  if (p === 'ranker') {
    v.querySelectorAll('[data-preset]').forEach(b => b.onclick = () => { const e = D.briefs[b.dataset.preset]; Object.assign(state.scenario, { preset: b.dataset.preset, o2: e.o2, pressure: e.pressure, flow: '', gravity: 'micro' }); render(); });
    $('scForm').onsubmit = e => { e.preventDefault(); Object.assign(state.scenario, { preset: null, o2: $('sO2').value, pressure: $('sP').value, flow: $('sF').value, gravity: $('sG').value }); render(); };
    if ($('clearSel')) $('clearSel').onclick = () => { state.selected = []; saveSel(); render(); };
  }
  if (p === 'ask') {
    v.querySelectorAll('[data-sugg]').forEach(b => b.onclick = () => { state.question = b.dataset.sugg; state.answer = answer(state.question); state.ai.result = null; state.ai.error = ''; render(); });
    $('askForm').onsubmit = e => { e.preventDefault(); const q = $('qText').value.trim(); if (!q) return; state.question = q; state.answer = answer(q); state.ai.result = null; state.ai.error = ''; render(); };
    $('aiKey').oninput = e => { state.ai.key = e.target.value.trim(); };
    $('aiModel').oninput = e => { state.ai.model = e.target.value.trim(); };
    $('aiRun').onclick = () => interpret(false);
    $('aiTest').onclick = () => interpret(true);
  }
}
render();

/* ---------- Alaa's atmosphere canvas (decorative) ---------- */
(function () {
  const canvas = document.getElementById('atmo'), glow = document.getElementById('glow'), ctx = canvas.getContext('2d', { alpha: true });
  if (!ctx) return;
  const reduced = matchMedia('(prefers-reduced-motion: reduce)'), fine = matchMedia('(pointer: fine)');
  let W = 0, H = 0, dpr = 1, anim = 0, last = 0, visible = !document.hidden, ptr = { x: -1000, y: -1000, active: false }, stars = [], embers = [];
  const rnd = (a, b) => a + Math.random() * (b - a);
  function ember(init) { return { x: rnd(W * .16, W * .94), y: init ? rnd(H * .52, H + 20) : H + rnd(0, 35), size: rnd(.7, 2.1), life: rnd(.18, .55), speed: rnd(.25, .8), sway: rnd(5, 23), phase: rnd(0, 6.28) }; }
  function resize() {
    W = innerWidth; H = innerHeight; dpr = Math.min(devicePixelRatio || 1, 1.75);
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr); canvas.style.width = W + 'px'; canvas.style.height = H + 'px'; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const n = Math.min(390, Math.max(190, Math.floor(W * H / 4700)));
    stars = Array.from({ length: n }, () => ({ x: rnd(0, W), y: rnd(0, H), r: rnd(.55, 1.8), phase: rnd(0, 6.28), speed: rnd(.25, .8) }));
    embers = Array.from({ length: Math.min(22, Math.floor(W / 65)) }, () => ember(true));
    if (reduced.matches) draw(0);
  }
  function draw(time) {
    ctx.clearRect(0, 0, W, H);
    const haze = ctx.createRadialGradient(W * .79, H * 1.08, 0, W * .79, H * 1.08, Math.max(W * .68, 420));
    haze.addColorStop(0, 'rgba(214,90,49,.24)'); haze.addColorStop(.32, 'rgba(185,65,30,.115)'); haze.addColorStop(.68, 'rgba(80,60,65,.025)'); haze.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = haze; ctx.fillRect(0, 0, W, H);
    for (let i = 0; i < stars.length; i++) {
      const s = stars[i], tw = .58 + .31 * Math.sin(time * s.speed + s.phase);
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fillStyle = `rgba(230,226,221,${tw})`; ctx.fill();
      if (ptr.active && fine.matches) { const d = Math.hypot(s.x - ptr.x, s.y - ptr.y); if (d < 175) { ctx.strokeStyle = `rgba(214,90,49,${(1 - d / 175) * .33})`; ctx.lineWidth = .8; ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(ptr.x, ptr.y); ctx.stroke(); } }
      for (let j = i + 1; j < Math.min(i + 22, stars.length); j++) {
        const o = stars[j], d = Math.hypot(s.x - o.x, s.y - o.y);
        if (d < 135) { const pr = ptr.active ? Math.max(0, 1 - Math.hypot((s.x + o.x) / 2 - ptr.x, (s.y + o.y) / 2 - ptr.y) / 230) : 0;
          ctx.strokeStyle = `rgba(169,175,190,${.055 + (1 - d / 135) * .105 + pr * .18})`; ctx.lineWidth = .65; ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(o.x, o.y); ctx.stroke(); }
      }
    }
    for (let i = 0; i < embers.length; i++) {
      const e = embers[i], prog = (H - e.y) / H, x = e.x + Math.sin(time * .8 + e.phase) * e.sway, a = Math.max(0, Math.min(1, (1 - prog) * e.life)) * .38, rad = e.size * (1 + prog * .45);
      const g = ctx.createRadialGradient(x, e.y, 0, x, e.y, rad * 4); g.addColorStop(0, `rgba(245,133,69,${a * .65})`); g.addColorStop(.25, `rgba(214,90,49,${a * .15})`); g.addColorStop(1, 'rgba(214,90,49,0)');
      ctx.fillStyle = g; ctx.fillRect(x - rad * 4, e.y - rad * 4, rad * 8, rad * 8);
      if (!reduced.matches) { e.y -= e.speed * 1.15; if (e.y < H * .27) embers[i] = ember(false); }
    }
  }
  function tick(t) { if (!visible || reduced.matches) return; if (t - last > 32) { last = t; draw(t / 1000); } anim = requestAnimationFrame(tick); }
  addEventListener('resize', resize);
  addEventListener('pointermove', e => { if (e.pointerType === 'touch') return; ptr = { x: e.clientX, y: e.clientY, active: true };
    if (fine.matches && !reduced.matches) { glow.style.opacity = '1'; glow.style.transform = `translate3d(${e.clientX}px,${e.clientY}px,0) translate(-50%,-50%)`; } }, { passive: true });
  document.addEventListener('pointerleave', () => { ptr.active = false; glow.style.opacity = '0'; });
  document.addEventListener('visibilitychange', () => { visible = !document.hidden; cancelAnimationFrame(anim); if (visible && !reduced.matches) anim = requestAnimationFrame(tick); });
  resize(); if (!reduced.matches) anim = requestAnimationFrame(tick);
})();
</script>
</body>
