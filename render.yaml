# Render Blueprint: New + > Blueprint > pick this repo / branch. Secrets are asked for in the dashboard (sync: false), never stored here.
services:
  - type: web
    name: mission-lens-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    branch: Backend
    plan: free               # measured: ~350 MB with the embedding model loaded (fits the free 512 MB; sleeps after 15 min idle)
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: MONGODB_URI     # Atlas connection string (mongodb+srv://...)
        sync: false
      - key: MONGODB_DB
        value: ignis_mu
      - key: MOCK
        value: "0"
      - key: CORS_ORIGINS    # the frontend origin(s), comma separated; "*" while developing
        value: "*"
      - key: ADMIN_TOKEN     # protects POST /api/admin/labels (choose a long random string)
        sync: false
      - key: ANTHROPIC_API_KEY   # optional: enables the number-checked LLM summary
        sync: false
