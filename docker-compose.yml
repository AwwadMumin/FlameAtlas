services:
  mongo:
    image: mongodb/mongodb-atlas-local:latest
    ports: ["${MONGO_PORT:-27018}:27017"]
    volumes: ["mongo_data:/data/db"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ping:1})"]
      interval: 5s
      retries: 20
  backend:
    build: ./backend
    env_file: [.env.example]
    environment:
      MONGODB_URI: mongodb://mongo:27017/?directConnection=true
    volumes: ["./data:/app/data", "./docs:/app/docs", "hf_cache:/hf", "./backend/app:/app/app", "./backend/tests:/app/tests", "./backend/scripts:/app/scripts"]
    ports: ["8000:8000"]
    depends_on:
      mongo: {condition: service_healthy}
volumes:
  mongo_data:
  hf_cache:
