/* Workspace additions (Team Orion): verified-data states, quotes, ranking. Built on Alaa's design. */
.verified-pill{display:flex;align-items:center;gap:8px;border:1px solid #454951;border-radius:7px;padding:9px 12px;font:600 11px 'IBM Plex Mono',monospace;color:#c9d8cf;white-space:nowrap;flex-shrink:0;text-decoration:none}

.preview-note.ok{border-color:#4f6b5c;background:#2c3530;color:#c7ded0}

.outcome{font:600 11px 'IBM Plex Mono',monospace;padding:4px 8px;border-radius:4px;white-space:nowrap;display:inline-block}

<div class="shell">

  <header class="topbar">
    <a class="brand" href="#explorer" aria-label="Flame Atlas home" style="text-decoration:none"><span class="brand-mark"><img src="__LOGO__" alt="Flame Atlas logo"></span><span><strong>FLAME ATLAS</strong><small>COMBUSTION RESEARCH INTELLIGENCE</small></span></a>
    <nav aria-label="Main navigation">

      <div><div class="overline">FLAME ATLAS <span>/</span> RESEARCH WORKSPACE</div><h1 id="pageTitle">Evidence Explorer</h1><p id="pageLede"></p></div>
      <div class="workspace-status"><span class="dot"></span><span id="statusText"></span></div>

    <span>NASA Space Apps Challenge · 2026 · <a href="index.html" style="color:#e58d70">Home</a> · <a href="story.html" style="color:#e58d70">The story</a></span>
  </footer>
</div>

<div id="drawerRoot"></div>

<script id="data" type="application/json">__DATA__</script>
<script>
const D = JSON.parse(document.getElementById('data').textContent);
const R = D.records;
const byId = Object.fromEntries(R.map(r => [r.id, r]));
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = (v, unit = '', d = 1) => v === null || v === undefined ? '—' : `${(+v).toFixed(d).replace(/\.0+$/, '')}${unit}`;
const pct = v => v === null || v === undefined ? '—' : `${Math.round(v * 100)}%`;
const gLabel = g => g === 'micro' ? 'Microgravity' : g === 'earth' ? 'Earth (1 g)' : g;
const outcome = r => r.sustained === true ? '<span class="outcome yes">Burned</span>' : r.sustained === false ? '<span class="outcome no">No sustained burn</span>' : '<span class="outcome unk">Not reported</span>';
const src = id => D.sources[id] || {title: id, url: null};
const families = [...new Set(R.map(r => r.material_family).filter(Boolean))].sort();
const invs = [...new Set(R.map(r => r.investigation))].sort();
const SOURCES = [...new Set(R.map(r => r.source_id))].sort();

const state = { query: '', family: 'All materials', gravity: 'All gravity', inv: 'All investigations', selected: [],
  scenario: { preset: 'moon', o2: 30, pressure: 70.3, flow: '', gravity: 'micro' }, question: '', answer: null };
try { const s = JSON.parse(sessionStorage.getItem('fa-selected') || '[]'); if (Array.isArray(s)) state.selected = s.filter(id => byId[id]); } catch (e) {}
const saveSel = () => { try { sessionStorage.setItem('fa-selected', JSON.stringify(state.selected)); } catch (e) {} };

/* ---------- the same mathematics as flame_atlas.py ---------- */
const VARS = [['o2_percent', 'o2'], ['pressure_kpa', 'pressure'], ['flow_cms', 'flow']];
function distance(run, sc) {
  if (sc.o2 !== null && run.o2_percent === null) return { d: Infinity, partial: true, terms: [] };
  let total = 0, used = 0; const terms = [];
  const wanted = VARS.filter(([, k]) => sc[k] !== null).length;
  for (const [f, k] of VARS) {
    if (sc[k] === null || run[f] === null || run[f] === undefined) continue;
    const t = (run[f] - sc[k]) / D.tol[f]; total += t * t; used++; terms.push({ f, k, run: run[f], target: sc[k], tol: D.tol[f], t });
  }
  if (!used) return { d: Infinity, partial: true, terms };
  return { d: Math.sqrt(total), partial: used < wanted, terms };
}
function wilson(k, n, z = 1.96) {
  if (!n) return null; const p = k / n, den = 1 + z * z / n, c = (p + z * z / (2 * n)) / den;
  const h = z * Math.sqrt(p * (1 - p) / n + z * z / (4 * n * n)) / den; return [Math.max(0, c - h), Math.min(1, c + h)];
}
function confidence(close) {
  const n = close.length, s = new Set(close.map(r => r.source_id)).size;
  return n >= 3 && s >= 2 ? 'High' : n >= 2 ? 'Medium' : n === 1 ? 'Low' : null;
}
function rank(sc) {
  const m = {};
  let nearest = null;
  for (const r of R) {
    if (r.gravity !== sc.gravity) continue;
    const { d, partial, terms } = distance(r, sc);
    // The nearest run must carry every variable the scenario sets (as in the engine's gap map).
    if (!partial && (!nearest || d < nearest.d)) nearest = { r, d, terms };
    if (d > 2) continue;
    const key = r.material_family || r.material; if (!key) continue;
    const e = m[key] = m[key] || { close: [], far: [], partial: false };
    (d <= 1 ? e.close : e.far).push(Object.assign({}, r, { d })); e.partial = e.partial || partial;
  }
  const rows = Object.entries(m).map(([material, e]) => {
    const known = e.close.filter(r => r.sustained !== null);
    const k = known.filter(r => r.sustained).length;
    return { material, close: e.close.length, far: e.far.length, share: known.length ? k / known.length : null,
      k, n: known.length, ci: wilson(k, known.length), conf: e.close.length ? confidence(e.close) : 'Low',
      sources: [...new Set(e.close.concat(e.far).map(r => r.source_id))].sort(), partial: e.partial, runs: e.close.concat(e.far) };
  });
  rows.sort((a, b) => (b.share ?? -1) - (a.share ?? -1) || b.close - a.close);
  return { rows, nearest };
}

/* ---------- routing ---------- */
const PAGES = {
  explorer: ['Evidence Explorer', 'Explore verified NASA combustion runs, inspect their conditions, and read the exact NASA words behind each one.'],
  ranker: ['Scenario Ranker', 'Set a habitat’s air, then see which materials have evidence there, how close it is, and how sure we can be.'],
  ask: ['Ask with Citations', 'Ask a research question. Every answer is assembled from verified NASA records and cites them; nothing is guessed.'],
};
function page() { const h = location.hash.replace('#', ''); return PAGES[h] ? h : 'explorer'; }
function go(p) { if (location.hash !== '#' + p) location.hash = p; else render(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
window.addEventListener('hashchange', render);
document.querySelectorAll('nav button').forEach(b => b.addEventListener('click', () => go(b.dataset.page)));

function chrome(p) {
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('active', b.dataset.page === p));
  const nc = document.getElementById('navCount'); nc.hidden = !state.selected.length; nc.textContent = state.selected.length;
  document.getElementById('pageTitle').textContent = PAGES[p][0];
  document.getElementById('pageLede').textContent = PAGES[p][1];
  document.getElementById('statusText').textContent = `${D.n_all} NASA records · 7 PSI investigations`;
  document.getElementById('dataNote').style.display = (p === 'explorer' && state.dataset === 'extended') ? 'none' : '';
  document.getElementById('dataNote').innerHTML = `<b>One dataset, nothing guessed.</b> ${D.n_all} records from 7 NASA PSI investigations. ${D.n_verified} were extracted by our code from NASA’s raw files and carry a quote checked word for word; the others cite the NASA report table they were transcribed from. Missing values stay empty.`;
}

function render() {
  const p = page(); chrome(p);
  const v = document.getElementById('view');
  v.innerHTML = p === 'explorer' ? explorer() : p === 'ranker' ? ranker() : ask();
  bind(p);
}

/* ---------- Evidence Explorer ---------- */
function filtered() {
  const q = state.query.trim().toLowerCase();
  return R.filter(r => {
    const text = `${r.id} ${r.investigation} ${r.material} ${r.material_family} ${r.outcome_text} ${r.quote} ${r.source_id}`.toLowerCase();
    return (!q || q.split(/\s+/).every(w => text.includes(w)))
      && (state.family === 'All materials' || r.material_family === state.family)
      && (state.gravity === 'All gravity' || gLabel(r.gravity) === state.gravity)
      && (state.inv === 'All investigations' || r.investigation === state.inv);
  });
}
function explorer() {
  if (state.dataset === 'extended' && X.length) return explorerExt();
  const rows = filtered();
  const opt = (list, cur) => list.map(x => `<option${x === cur ? ' selected' : ''}>${esc(x)}</option>`).join('');
  return `${dsToggle()}
  <section class="panel search-panel"><form id="searchForm">
    <label class="search-field"><span aria-hidden="true">⌕</span><input id="q" value="${esc(state.query)}" placeholder="Search runs, materials, investigations or NASA’s words (e.g. silicone, PMMA, extinguished)" aria-label="Search experiments"><kbd>SEARCH</kbd></label>
    <div class="filter-row">
      <label>Material<select id="fFam">${opt(['All materials', ...families], state.family)}</select></label>
      <label>Gravity regime<select id="fGrav">${opt(['All gravity', 'Microgravity', 'Earth (1 g)'], state.gravity)}</select></label>
      <label>Investigation<select id="fInv">${opt(['All investigations', ...invs], state.inv)}</select></label>
      <button type="button" class="btn ghost" id="clear">Clear filters</button>
      <button type="submit" class="btn primary">Search evidence <span>→</span></button>
    </div></form></section>
  <div class="metrics">
    <div><span>REAL-MATERIAL RECORDS</span><strong>${R.length}</strong><small>${R.filter(r => r.quote).length} with a word-for-word NASA quote</small></div>
    <div><span>VISIBLE RESULTS</span><strong>${rows.length}</strong><small>Matching current filters</small></div>
    <div><span>SELECTED EVIDENCE</span><strong>${state.selected.length}</strong><small>Ready for the Scenario Ranker</small></div>
  </div>
  <section class="panel results">
    <div class="panel-title"><div><span class="overline">DATA EXPLORATION</span><h2>Experiment catalog</h2></div><span>${rows.length} ${rows.length === 1 ? 'record' : 'records'}</span></div>
    ${rows.length ? `<div class="table-wrap"><table><thead><tr><th aria-label="Select"></th><th>RUN / INVESTIGATION</th><th>MATERIAL</th><th>GRAVITY</th><th>OXYGEN</th><th>PRESSURE</th><th>AIRFLOW</th><th>OUTCOME</th><th>SOURCE</th></tr></thead><tbody>
      ${rows.map(r => `<tr class="${state.selected.includes(r.id) ? 'row-selected' : ''}">
        <td><input type="checkbox" data-sel="${esc(r.id)}" aria-label="Select ${esc(r.id)}" ${state.selected.includes(r.id) ? 'checked' : ''}></td>
        <td><button class="record-link" data-open="${esc(r.id)}"><strong>${esc(r.material)}</strong><small>${esc(r.investigation)} · ${esc(r.id)}</small></button></td>
        <td>${esc(r.material_family || '—')}</td><td>${gLabel(r.gravity)}</td>
        <td class="numeric">${fmt(r.o2_percent, '%')}</td><td class="numeric">${fmt(r.pressure_kpa, ' kPa')}</td><td class="numeric">${fmt(r.flow_cms, ' cm/s')}</td>
        <td>${outcome(r)}</td><td><button class="inline-link" data-open="${esc(r.id)}">${r.quote ? 'NASA quote ↗' : 'Source ↗'}</button></td></tr>`).join('')}
    </tbody></table></div>` : `<div class="empty"><h3>No matching runs</h3><p>No verified NASA run matches these filters. Flame Atlas shows only what NASA recorded.</p></div>`}
    <div class="table-footer"><span>Values and units come from NASA’s tables; unit conversion is done by code. Missing values stay empty, never filled in.</span>
      ${state.selected.length ? `<button class="btn primary" id="toRanker">Compare ${state.selected.length} selected →</button>` : ''}</div>
  </section>
  <section class="below-grid">
    <div class="panel insight"><div class="panel-title"><div><span class="overline">RESEARCH WORKFLOW</span><h2>From evidence to insight</h2></div></div>
      <div class="workflow"><span>01 <strong>Find evidence</strong></span><b>→</b><span>02 <strong>Rank for a habitat</strong></span><b>→</b><span>03 <strong>Ask with citations</strong></span></div>
      <p>Select runs here, set a habitat’s oxygen and pressure in the Scenario Ranker, and see how close NASA’s evidence really is, measured by one transparent equation.</p></div>
    <div class="panel source-info"><div class="panel-title"><div><span class="overline">SOURCE PROVENANCE</span><h2>Traceable research</h2></div></div>
      <p>${SOURCES.map(s => `<a class="inline-link" style="margin:0" href="${esc(src(s).url)}" target="_blank" rel="noreferrer">${esc(s)}</a> ${esc(src(s).title)}`).join('<br>')}</p>
      <button class="inline-link" data-go="ask">Open research assistant ↗</button></div>
  </section>`;
}


/* ---------- Extended catalog (team-built from NASA tables; not quote-verified) ---------- */
const X = D.ext || [], xById = Object.fromEntries(X.map(r => [r.id, r]));
state.dataset = 'verified'; state.x = { query: '', cls: 'All fuel types', inv: 'All investigations' };
const xInvs = [...new Set(X.map(r => r.inv))].sort(), xCls = [...new Set(X.map(r => r.cls))].sort();
function dsToggle() {
  if (!X.length) return '';
  return `<div class="ds-toggle">
    <button data-ds="verified" class="${state.dataset === 'verified' ? 'on' : ''}">Real materials · ${R.length} records<small>BASS, BASS-II, Saffire I–III. Feeds rankings, statistics and the AI model.</small></button>
    <button data-ds="extended" class="${state.dataset === 'extended' ? 'on' : ''}">Emulated solids and gas flames · ${X.length} records<small>ACME BRE (up to 40% O₂, 57 kPa) and CFI-G. Different physics: shown, not mixed into material rankings.</small></button></div>`;
}
function xFiltered() {
  const q = state.x.query.trim().toLowerCase();
  return X.filter(r => (!q || q.split(/\s+/).every(w => `${r.id} ${r.inv} ${r.mat} ${r.cls} ${r.out} ${r.notes} ${r.psi}`.toLowerCase().includes(w)))
    && (state.x.cls === 'All fuel types' || r.cls === state.x.cls) && (state.x.inv === 'All investigations' || r.inv === state.x.inv));
}
function explorerExt() {
  const rows = xFiltered(), show = rows.slice(0, 300), c = D.catalog;
  const opt = (list, cur) => list.map(x => `<option${x === cur ? ' selected' : ''}>${esc(x)}</option>`).join('');
  return `${dsToggle()}
  <div class="preview-note"><b>Same dataset, different physics.</b> ACME BRE burns gas to emulate a solid; CFI-G studies gas flames. BRE is the only NASA microgravity data that reaches Moon-base air, so it has its own AI model. Neither is mixed into the ranking of real materials. Each record cites its NASA source.</div>
  <section class="panel search-panel"><form id="xForm">
    <label class="search-field"><span aria-hidden="true">⌕</span><input id="xq" value="${esc(state.x.query)}" placeholder="Search the catalog (e.g. heptane, PMMA, extinction, Kapton)" aria-label="Search catalog"><kbd>SEARCH</kbd></label>
    <div class="filter-row"><label>Fuel type<select id="xCls">${opt(['All fuel types', ...xCls], state.x.cls)}</select></label>
      <label>Investigation<select id="xInv">${opt(['All investigations', ...xInvs], state.x.inv)}</select></label>
      <button type="button" class="btn ghost" id="xClear">Clear filters</button><button type="submit" class="btn primary">Search catalog <span>→</span></button></div></form></section>
  <div class="metrics">
    <div><span>RECORDS</span><strong>${X.length}</strong><small>ACME BRE (PSI-20) and CFI-G (PSI-159)</small></div>
    <div><span>VISIBLE RESULTS</span><strong>${rows.length}</strong><small>Matching current filters</small></div>
    <div><span>HIGHEST O₂ (BRE)</span><strong>${fmt(D.model.bre.o2_range[1], '%')}</strong><small>Lowest pressure ${fmt(D.model.bre.pressure_range_kpa[0], ' kPa')}</small></div>
  </div>
  <section class="panel results"><div class="panel-title"><div><span class="overline">EMULATED SOLIDS AND GAS FLAMES</span><h2>ACME investigations</h2></div><span>${rows.length} rows${rows.length > show.length ? ` · showing first ${show.length}` : ''}</span></div>
    ${show.length ? `<div class="table-wrap"><table><thead><tr><th>ROW / INVESTIGATION</th><th>FUEL</th><th>TYPE</th><th>GRAVITY</th><th>OXYGEN</th><th>PRESSURE</th><th>OUTCOME</th><th>SOURCE</th></tr></thead><tbody>
    ${show.map(r => `<tr><td><button class="record-link" data-xopen="${esc(r.id)}"><strong>${esc(r.inv)}</strong><small>${esc(r.id)}${r.psi ? ' · ' + esc(r.psi) : ''}</small></button></td>
      <td>${esc(r.mat)}</td><td>${esc(r.cls)}</td><td>${esc(r.g)}</td><td class="numeric">${fmt(r.o2, '%')}</td><td class="numeric">${fmt(r.p, ' kPa')}</td>
      <td>${esc(r.out || '—')}</td><td><button class="inline-link" data-xopen="${esc(r.id)}">Source ↗</button></td></tr>`).join('')}
    </tbody></table></div>` : `<div class="empty"><h3>No matching rows</h3><p>Nothing in the catalog matches these filters.</p></div>`}

})();
